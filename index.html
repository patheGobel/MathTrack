<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathTrack - Plateforme de Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <h1>MathTrack</h1>
                <p>Vos notes de mathématiques en un clic</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="identifiant">Identifiant :</label>
                    <input type="text" id="identifiant" name="identifiant" required>
                </div>

                <div class="form-group">
                    <label for="mot_de_passe">Mot de passe :</label>
                    <input type="password" id="mot_de_passe" name="mot_de_passe" required>
                </div>

                <button type="submit" class="btn-primary">Se connecter</button>
            </form>

            <div id="message" class="message"></div>
        </div>

        <!-- Dashboard (caché au début) -->
        <div class="dashboard" style="display: none;">
            <div class="header">
                <div class="container">
                    <div class="header-content">
                        <div class="user-info">
                            <h1 id="userName">Prénom Nom</h1>
                            <p id="userClass">Classe</p>
                        </div>
                        <button onclick="deconnexion()" class="btn-secondary">Déconnexion</button>
                    </div>
                </div>
            </div>

            <div class="container">
                <div class="maths-header">
                    <h2>Mathématiques</h2>
                    <p>Consultez vos notes et votre progression</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Moyenne aux Tests</h3>
                        <div class="moyenne-generale" id="moyenneTests">0.00/5</div>
                    </div>
                    <div class="stat-card">
                        <h3>Moyenne aux Devoirs</h3>
                        <div class="moyenne-generale" id="moyenneDevoirs">0.00/20</div>
                    </div>
                    <div class="stat-card">
                        <h3>Moyenne aux Compo</h3>
                        <div class="moyenne-generale" id="moyenneCompo">0.00/20</div>
                    </div>
                </div>

                <div class="card">
                    <h2>Détail de vos notes</h2>

                    <div class="filters">
                        <button class="filter-btn active" onclick="filtrerNotes('tous')">Toutes les notes</button>
                        <button class="filter-btn" onclick="filtrerNotes('test')">Tests</button>
                        <button class="filter-btn" onclick="filtrerNotes('devoir')">Devoirs</button>
                        <button class="filter-btn" onclick="filtrerNotes('compo')">Compositions</button>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Matière</th>
                                <th>Type</th>
                                <th>Note</th>
                                <th>Coefficient</th>
                                <th>Commentaire</th>
                            </tr>
                        </thead>
                        <tbody id="notesTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
